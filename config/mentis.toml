# ============================================================================
#  mentis — configurazione dell'orchestratore agnostico
# ----------------------------------------------------------------------------
#  Questo file è l'UNICO punto in cui vivono i dettagli specifici di ciascun
#  provider. Gli agenti in ../agents/*.md restano neutri (tier + reasoning);
#  qui si traduce quell'intenzione nei modelli e nei flag reali di ogni CLI.
#
#  Aggiungere un provider domani = aggiungere una sezione [providers.X] e una
#  colonna alle mappe. Gli agenti non si toccano mai.
# ============================================================================

# Ordine di preferenza. In modalità "fallback" si prova dall'alto verso il
# basso finché uno risponde senza rate-limit/errore.
preference = ["claude", "codex"]

# Modalità di default dell'orchestratore:
#   fallback  → prova un provider, al primo errore passa al successivo
#   compare   → lancia lo stesso task su TUTTI i provider e diffa gli output
mode = "fallback"

# Routing: come si sceglie chi implementa.
#   static    → segue sempre l'ordine di `preference`
#   balanced  → load-aware: implementa il provider MENO carico, così i due
#               abbonamenti si consumano insieme invece di esaurirne uno solo
#               (i ruoli restano sempre separati per l'anti-bias). Vedi DESIGN §11.
routing = "balanced"

# ----------------------------------------------------------------------------
#  PROVIDER
#  cmd = template di invocazione headless della CLI. Segnaposti sostituiti
#  dall'orchestratore: {prompt} {model} {reasoning} {workdir}.
#
#  ⚠️  I FLAG ESATTI VANNO CONFERMATI QUANDO INSTALLI LE CLI (cambiano spesso).
#      La forma è corretta; verifica i nomi di flag con `claude --help` /
#      `codex --help` e aggiorna solo queste due righe.
#
#  enabled = false → provider cablato ma spento (nessun abbonamento attivo).
#  auth    = come ci si autentica: entrambe con abbonamento, NON con API key.
# ----------------------------------------------------------------------------

[providers.claude]
enabled = false                       # metti true dopo il login con Pro/Max
auth    = "subscription"              # Claude Pro/Max — non API key
cmd     = "claude -p {prompt} --model {model} --permission-mode acceptEdits"
# comando per elencare i modelli disponibili (usato da `mentis.py doctor`).
# ⚠️ VERIFICA il flag reale con `claude --help`. Vuoto = doctor non può
# interrogare la CLI, gli passi la lista a mano con --models.
list_models_cmd = ""                  # es. "claude --list-models"
# nota: Claude Code usa il "thinking budget"; l'orchestratore passa il livello
# reasoning tramite la mappa [reasoning_map] sotto (non c'è un flag numerico
# universale — vedi DESIGN.md §reasoning).

[providers.codex]
enabled = false                       # metti true dopo il login con ChatGPT Plus/Pro
auth    = "subscription"              # account ChatGPT — non API key
cmd     = "codex exec {prompt} --model {model} --reasoning {reasoning}"
list_models_cmd = ""                  # es. "codex --list-models" — VERIFICA con `codex --help`

# ----------------------------------------------------------------------------
#  TIER_KEYWORDS — parola che lega un tier al nome del modello, per il `doctor`.
#  Quando esce una nuova famiglia (es. gpt-5.7-*), doctor cerca tra i modelli
#  disponibili quello che contiene la keyword del tier e ha la versione più alta.
# ----------------------------------------------------------------------------

[tier_keywords.claude]
frontier = "opus"
balanced = "sonnet"
fast     = "haiku"

[tier_keywords.codex]
frontier = "sol"
balanced = "terra"
fast     = "luna"

# ----------------------------------------------------------------------------
#  MAPPA TIER → MODELLO  (asse 1: quale modello)
#  L'agente dichiara tier = frontier|balanced|fast; qui diventa il modello
#  reale del provider su cui sta girando.
# ----------------------------------------------------------------------------

[model_map.claude]
frontier = "opus-4-8"
balanced = "sonnet"
fast     = "haiku-4-5"

[model_map.codex]
frontier = "gpt-5.6-sol"
balanced = "gpt-5.6-terra"
fast     = "gpt-5.6-luna"

# ----------------------------------------------------------------------------
#  MAPPA REASONING → EFFORT  (asse 2: quanto ragiona — ortogonale al tier)
#  L'agente dichiara reasoning = none|low|medium|high|max.
#  Se un provider non ha un gradino, l'orchestratore fa CLAMPING al più vicino
#  disponibile (vedi DESIGN.md).
# ----------------------------------------------------------------------------

# Claude: il reasoning si traduce in budget di extended-thinking (token).
[reasoning_map.claude]
none   = 0
low    = 2000
medium = 5000
high   = 10000
max    = 24000

# Codex/GPT-5.6: reasoning effort discreto. "max" → ultra mode.
[reasoning_map.codex]
none   = "minimal"
low    = "low"
medium = "medium"
high   = "high"
max    = "ultra"

# ----------------------------------------------------------------------------
#  POLICY DI REVIEW — anti-bias cross-provider
#  Il reviewer NON deve mai girare sullo stesso provider che ha implementato.
#  L'orchestratore legge chi ha implementato (da .mentis/state.json nel
#  progetto) e sceglie per il reviewer un provider DIVERSO.
# ----------------------------------------------------------------------------

[review]
cross_provider = true                 # forza reviewer ≠ implementer
# con 2 provider è deterministico (l'altro). Con 3+, sceglie il primo in
# `preference` diverso dall'implementer.
on_no_alternative = "warn"            # se esiste un solo provider attivo:
                                      #   "warn"  → procede segnalando che
                                      #             l'anti-bias non è garantito
                                      #   "block" → rifiuta la review

# ----------------------------------------------------------------------------
#  PIPELINE — mappa comando utente → sequenza di agenti (regista "semplice",
#  deterministico). Ogni voce è un agente di ../agents/.
#  L'orchestratore esegue gli step in ordine; il provider di ogni step segue
#  `mode` (fallback) salvo la review, governata da [review].
# ----------------------------------------------------------------------------

[pipeline.build]                      #  mentis "build ..."  → pipeline completa
steps = [
  "business-analyst",
  "tech-architect",
  "implementation-planner",
  "developer",
  "qa-engineer",
  "reviewer",
  "documentation-agent",
]

[pipeline.tad]                        #  mentis "tad ..."  → solo architettura
steps = ["tech-architect"]

[pipeline.bad]                        #  mentis "bad ..."  → solo analisi
steps = ["business-analyst"]

[pipeline.review]                     #  mentis "review ..." → solo review (cross-provider)
steps = ["reviewer"]

[pipeline.mvp]                        #  mentis "mvp ..."  → sito statico
steps = ["mvp-builder"]

# ----------------------------------------------------------------------------
#  RELIABILITY — layered fallback + circuit breaker (vedi DESIGN §3)
# ----------------------------------------------------------------------------

[reliability]
retry_budget         = 6      # tentativi di fallback TOTALI per run, poi stop+escalation
backoff_seconds      = 2      # attesa prima di un retry su errore transitorio
circuit_open_for_run = true   # un provider rate-limited resta escluso per il resto del run

# ----------------------------------------------------------------------------
#  BALANCE — router load-aware (routing = "balanced"). Vedi DESIGN §11.
#  Contatore di lavoro pesato per provider, persistito in .mentis/state.json.
#  Chi implementa = provider col costo più basso; l'evaluator = il più scarico
#  tra gli altri. Così i ruoli ruotano e i due budget si esauriscono insieme.
# ----------------------------------------------------------------------------

[balance.weights]             # costo relativo per tipo di operazione (generare = caro)
implement = 1.0               # generare l'artefatto
optimize  = 1.0               # revisione dopo bocciatura (riscrive l'artefatto)
reflect   = 0.5               # auto-critica (a volte riscrive)
evaluate  = 0.3               # critica breve (verdetto + problemi)

[balance.window]              # ore prima che la quota di un provider si SBLOCCHI (reset del contatore)
                              # ⚠️ STIMA — calibra dopo il primo run reale osservando i limiti veri
default = 5
claude  = 5
codex   = 5

# ----------------------------------------------------------------------------
#  QUALITY — Reflection + Evaluator-Optimizer (vedi DESIGN §9)
#  Manopola di sessione: --quality off|reflect|evaluate|full (override globale).
#  Se assente, si usa il profilo per-agente qui sotto (pesato sul rischio).
#    reflect  = auto-critica stesso provider
#    evaluate = evaluator cross-provider (loop optimizer)
#    full     = reflection poi evaluator
# ----------------------------------------------------------------------------

[quality]
loop_cap = 2                  # max revisioni dell'evaluator-optimizer, poi escalation all'utente

[quality.profile]             # default per agente (off|reflect|evaluate|full)
business-analyst       = "evaluate"   # a monte, nessuna CI a valle → check indipendente
tech-architect         = "evaluate"   # massimo effetto-leva
implementation-planner = "evaluate"
developer              = "reflect"    # il code-review cross-provider è già lo step `reviewer`
qa-engineer            = "reflect"
devops-engineer        = "reflect"
documentation-agent    = "reflect"
mvp-builder            = "reflect"
reviewer               = "off"        # è LUI l'evaluator: non si valuta l'evaluator

[quality.rubric]              # criteri dell'evaluator per agente (fallback: default)
default                = "completezza; assenza di ambiguità; coerenza interna; decisioni testabili e verificabili"
business-analyst       = "requisiti completi e non ambigui; casi limite coperti; criteri di accettazione testabili; nessuna contraddizione interna"
tech-architect         = "scelte tecniche giustificate; nessun gap rispetto al BAD; sezioni coerenti tra loro; fattibilità; vincoli non-funzionali indirizzati"
implementation-planner = "task scomposti e stimati; dipendenze corrette e senza cicli; copertura completa del TAD; DEPS.json coerente"
